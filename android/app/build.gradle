// Aplikacja rdp.app na Androida: Trusted Web Activity – pełny ekran z aplikacją https://app.ruszniak.io (silnik Chrome,
// powiadomienia i logowanie jak w przeglądarce). Budowana i podpisywana automatycznie na GitHubie (.github/workflows/android.yml).
plugins { id 'com.android.application' }

def vCode = (System.getenv('VERSION_CODE') ?: '1') as Integer

android {
    namespace 'io.ruszniak.app'
    compileSdk 34
    defaultConfig {
        applicationId 'io.ruszniak.app'
        minSdk 23
        targetSdk 34
        versionCode vCode
        versionName "1.${vCode}"
        manifestPlaceholders = [apkVersion: vCode]
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'brak.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'appr'
            keyPassword System.getenv('KS_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
