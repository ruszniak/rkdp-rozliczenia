<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Podpisz dokument – rdp.app</title>
<link rel="icon" href="/favicon-v7.svg" type="image/svg+xml">

<body>
<header><div class="in"><span class="brand"><img src="/logo-rdp.svg" alt="rdp.app" width="32" height="32"><span>Podpis dokumentu</span></span><span class="appname">rdp.app</span></div></header>
<main id="box" aria-live="polite">
  <p class="meta">Wczytywanie…</p>
</main>

<template id="tpl">
<p class="kicker">Dokument do podpisu</p>
<h1 id="ttl">Podpisz dokument</h1>
<p class="meta" id="who"></p>

<section class="card-s">
  <h2 class="h">1. Przeczytaj dokument</h2>
  <p>Sprawdź treść i swoje dane. Jeśli coś się nie zgadza albo masz pytania – zgłoś uwagi, zanim podpiszesz.</p>
  <div class="ver" id="ver" hidden></div>
  <div class="doc-view" id="view" hidden><iframe id="frame" title="Treść dokumentu" sandbox></iframe></div>
  <div class="doc-acts">
    <a class="btn-p" id="dl" href="#" download>Pobierz PDF do podpisu</a>
    <button class="btn-s" type="button" id="noteBtn">Zgłoś uwagi</button>
    <button class="btn-s" type="button" id="fullBtn" hidden>Pełny ekran</button>
    <button class="btn-s" type="button" id="acceptBtn" hidden>Akceptuję – przejdź do podpisu</button>
  </div>
  <p class="small" id="dlname"></p>
  <div class="notes" id="notes" hidden></div>
  <div class="decide" id="decide" hidden>
    <p><b>Biuro odniosło się do Państwa uwag.</b> Jeśli zgadzają się Państwo ze stanowiskiem biura, kliknij „Akceptuję” – przygotujemy umowę do podpisu i wyślemy e-mail, gdy będzie gotowa. Możesz też zgłosić kolejne uwagi.</p>
    <div class="doc-acts"><button class="btn-p" type="button" id="accBtn">Akceptuję stanowisko biura</button><button class="btn-s" type="button" id="moreBtn">Zgłoś kolejne uwagi</button></div>
    <p class="err" id="accErr" hidden></p>
  </div>
  <p class="decided" id="decided" hidden>Zaakceptowali Państwo stanowisko biura. Przygotowujemy umowę do podpisu – dostaną Państwo e-mail, gdy będzie gotowa (pod tym samym linkiem).</p>
  <form class="note-form" id="noteForm" hidden>
    <label for="noteTxt"><b id="noteLbl">Twoje uwagi do dokumentu</b></label>
    <textarea id="noteTxt" rows="5" maxlength="4000" placeholder="Np. „W § 2 proszę dopisać…”, „Błędny adres – poprawny to…”"></textarea>
    <label for="noteWho" class="small">Imię i nazwisko (opcjonalnie)</label>
    <input id="noteWho" maxlength="120" autocomplete="name">
    <p class="err" id="noteErr" hidden></p>
    <div class="doc-acts"><button class="btn-p" type="submit" id="noteSend">Wyślij uwagi</button><button class="btn-s" type="button" id="noteCancel">Anuluj</button></div>
    <p class="small">Uwagi trafią od razu do biura. Odpowiedź zobaczysz na tej stronie i dostaniesz ją e-mailem; w razie zmian przygotujemy nową wersję dokumentu pod tym samym linkiem.</p>
  </form>
</section>

<section class="card-s">
  <h2 class="h">2. Podpisz – wybierz sposób</h2>
  <nav class="ways" aria-label="Sposób podpisu">
    <a href="#pz" data-way="pz"><b>Profil zaufany</b><span>bezpłatnie, przez gov.pl</span></a>
    <a href="#kw" data-way="kw"><b>Podpis kwalifikowany</b><span>jeśli masz certyfikat</span></a>
    <a href="#rk" data-way="rk"><b>Odręcznie</b><span>wydruk i skan</span></a>
  </nav>

  <div class="way-box" id="pz">
    <h3>Profil zaufany (podpis zaufany)</h3>
    <ol>
      <li>Pobierz PDF (przycisk w kroku 1) i zapisz go na komputerze lub telefonie.</li>
      <li>Otwórz <a href="https://www.gov.pl/gov/podpisz-dokument-elektronicznie---wykorzystaj-podpis-zaufany" target="_blank" rel="noopener">gov.pl → „Podpisz dokument elektronicznie”</a> i kliknij <strong>„Start”</strong>.</li>
      <li>Kliknij <strong>„Wybierz dokument z dysku”</strong> i wskaż pobrany PDF.</li>
      <li>Wybierz <strong>„Podpisz”</strong> → <strong>podpis zaufany</strong>. Zaloguj się profilem zaufanym (bank, mObywatel, login i hasło) i potwierdź kodem.</li>
      <li>Kliknij <strong>„Pobierz”</strong> – zapisze się podpisany plik (PDF albo XML). Ten plik wgraj w kroku 3.</li>
    </ol>
    <p class="small">Profil zaufany założysz bezpłatnie w kilka minut przez bankowość elektroniczną na <a href="https://pz.gov.pl" target="_blank" rel="noopener">pz.gov.pl</a>.</p>
  </div>

  <div class="way-box" id="kw" hidden>
    <h3>Podpis kwalifikowany</h3>
    <ol>
      <li>Pobierz PDF (przycisk w kroku 1).</li>
      <li>Otwórz program do podpisu od swojego dostawcy (np. SimplySign / proCertum, Szafir, CenCert, Sigillum) i wybierz <strong>„Podpisz”</strong>.</li>
      <li>Wskaż plik i wybierz format <strong>PAdES</strong> (podpis wewnątrz PDF) – jeśli program pyta. Format XAdES (plik .xml) też przyjmiemy.</li>
      <li>Zapisz podpisany plik i wgraj go w kroku 3.</li>
    </ol>
  </div>

  <div class="way-box" id="rk" hidden>
    <h3>Podpis odręczny</h3>
    <ol>
      <li>Pobierz PDF (krok 1), wydrukuj go i podpisz go w miejscu na podpis (na każdej wymaganej stronie).</li>
      <li>Zeskanuj podpisane strony albo zrób wyraźne zdjęcia telefonem (najlepiej jako jeden PDF).</li>
      <li>Wgraj skan w kroku 3. Oryginał przekaż nam przy najbliższej okazji albo wyślij pocztą.</li>
    </ol>
  </div>
</section>

<section class="card-s" id="up">
  <h2 class="h">3. Odeślij podpisany plik</h2>
  <label class="drop" id="drop">
    <input type="file" id="file" accept=".pdf,.xml,.xades,.p7s,.p7m,.sig,.asice,.asics,.zip,.jpg,.jpeg,.png,.heic,application/pdf,image/*">
    <b>Wybierz podpisany plik</b><span>albo przeciągnij go tutaj · PDF, XML, zdjęcie lub skan, do 25 MB</span>
  </label>
  <p class="err" id="err" hidden></p>
  <button class="btn-p" type="button" id="send" disabled>Wyślij podpisany dokument</button>
  <p class="small">Wolisz e-mailem? Odpowiedz na naszą wiadomość i dołącz podpisany plik.</p>
</section>

<section class="card-s done" id="done" hidden>
  <h2 class="h">Dziękujemy. Dokument dotarł do nas</h2>
  <p>Podpisany plik jest już w naszym biurze. Nic więcej nie musisz robić – w razie potrzeby skontaktujemy się z Tobą.</p>
  <div id="final" hidden>
    <p>Twój egzemplarz, podpisany przez obie strony:</p>
    <p><a class="btn-p" id="finalDl" href="#" download>Pobierz swój egzemplarz</a></p>
  </div>
</section>
