<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Wgraj dokumenty · rdp.app</title>
  <link rel="icon" href="/favicon-v7.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:"Lora";src:url(/fonts/pdf/Lora-SemiBold.woff) format("woff");font-weight:500 700;font-display:swap}
    :root{--ink:#16181D;--text:#2B2E35;--muted:#676B73;--line:#E3DFD8;--line-2:#CFC9BF;--accent:#7A5A37;--accent-bg:#F7F3EC;--paper-2:#F7F6F3;--btn:#1C1F26;--warn:#A3261B;--ok:#3E6B47;
      --serif:"Lora",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:var(--text);font:16.5px/1.6 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
    header{border-bottom:1px solid var(--line);padding:0 clamp(18px,5vw,36px)}
    header img{height:28px;width:28px;display:block;border-radius:7px}
    .hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
    .hdr .brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15.5px;color:var(--ink)}
    .hdr .brand>span{padding-left:12px;border-left:1px solid var(--line)}
    .hdr .appname{font-weight:600;font-size:14.5px;color:var(--muted);letter-spacing:.02em}
    .wrap{max-width:680px;margin:0 auto}
    main.wrap{padding:0 clamp(18px,5vw,36px)}
    .card{padding:44px 0 24px}
    h1{font:600 clamp(28px,4.4vw,36px)/1.18 var(--serif);color:var(--ink);margin:0 0 10px}
    .eyebrow{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 8px}
    p{margin:0 0 12px}
    ul{padding-left:22px;margin:10px 0}
    .msg{border-left:2px solid var(--accent);background:var(--accent-bg);padding:12px 18px;margin:14px 0;color:var(--text);white-space:pre-line}
    .drop{border:1px dashed var(--line-2);border-radius:6px;padding:28px 16px;text-align:center;margin:20px 0 12px;background:var(--paper-2);cursor:pointer}
    .drop:hover,.drop.over{border-color:var(--ink);background:#fff}
    .drop b{display:block;color:var(--ink);font-size:17px;margin-bottom:2px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
    button,.btn{font:600 16px var(--sans);border:1px solid var(--btn);border-radius:6px;padding:11px 20px;min-height:46px;cursor:pointer;background:var(--btn);color:#fff;display:inline-flex;align-items:center;gap:8px}
    .btn.alt{background:#fff;color:var(--ink);border-color:var(--line-2)}
    button:disabled{opacity:.35;cursor:default}
    .files{list-style:none;padding:0;margin:10px 0 0;border-top:1px solid var(--line)}
    .files li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
    .files li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .files li i{font-style:normal;font-size:14px;color:var(--muted)}
    .files li.ok i{color:var(--ok);font-weight:600}.files li.bad i{color:var(--warn);font-weight:600}
    .done{border-left:2px solid var(--ok);background:#F3F6F1;padding:14px 20px}
    .done .ico{display:none}
    .err{color:var(--warn);font-weight:600}
    .foot{font-size:13.5px;color:var(--muted);margin:8px 0 36px;padding-top:18px;border-top:1px solid var(--line)}
    .muted{color:var(--muted);font-size:15px}
    .hidden{display:none}
  </style>
</head>
<body>
  <header><div class="wrap hdr"><span class="brand"><img src="/logo-rdp.svg" alt="rdp.app" width="28" height="28"><span>Wgraj dokumenty</span></span><span class="appname">rdp.app</span></div></header>
  <main class="wrap">
    <div class="card" id="box"><p class="muted">Wczytywanie…</p></div>
    <p class="foot">Pliki trafiają bezpośrednio do biura RKDP spółka doradztwa podatkowego sp. z o.o. i są widoczne tylko dla zespołu prowadzącego Twoje rozliczenia.<br>Dane objęte tajemnicą doradcy podatkowego.</p>
  </main>
  <script src="/config.js"></script>
  <script src="/wgraj.js"></script>
</body>
</html>
